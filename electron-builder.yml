appId: com.cafemanager.app
productName: Cafe Manager
npmRebuild: false   # better-sqlite3 13 ships ready-made Windows binaries
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # better-sqlite3 ships C++ sources, SQLite's source and binaries for every OS. Only the Windows x64 binary runs.
  - "!node_modules/better-sqlite3/{deps,src}/**"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/better-sqlite3/prebuilds/{linux-arm64,linux-x64,linuxmusl-arm64,linuxmusl-x64,darwin-arm64,darwin-x64,win32-arm64}.node"
  - "!node_modules/node-addon-api/**"   # build-time headers, not used at runtime
asarUnpack:
  - "**/*.node"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [ x64 ]
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: CafeManager-Setup.${ext}
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
