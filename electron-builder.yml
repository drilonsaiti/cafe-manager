appId: com.cafemanager.app
productName: Cafe Manager
npmRebuild: false   # better-sqlite3 13 ships ready-made Windows binaries
directories:
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: CafeManager-Setup.${ext}
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
